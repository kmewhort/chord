[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chord-rank"
version = "0.1.0"
description = "CHORD: Cross-cluster Harmonized Optimization of Reception and Dissonance — a bridging, attention-economy feed-ranking algorithm for federated social networks."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "CHORD contributors" }]
dependencies = [
    "numpy>=1.23",
    "scipy>=1.9",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]
# Extra deps for the opt-in retroactive-validation suite (Appendix C) under
# validate/. Keeps the pure numpy/scipy core untouched; pandas/pyarrow are only
# needed to read the public datasets (CSV / Parquet), requests to fetch them.
validate = ["pytest>=7.0", "pandas>=1.5", "pyarrow>=10", "requests>=2.28"]

[tool.setuptools.packages.find]
where = ["."]
include = ["chord*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::RuntimeWarning"]
